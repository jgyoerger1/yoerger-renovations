<div class="lb" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
  <div class="lb-top">
    <span class="lb-count">1 / 1</span>
    <button class="lb-x" type="button" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="lb-stage">
    <button class="lb-nav prev" type="button" aria-label="Previous photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <img class="lb-img" alt="">
    <button class="lb-nav next" type="button" aria-label="Next photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <div class="lb-cap">
    <span class="tile-cat lb-cat"></span>
    <b class="lb-title"></b>
    <span class="lb-caption"></span>
  </div>
</div>
<script type="application/json" id="projectsData">{{projectsJson}}</script>
