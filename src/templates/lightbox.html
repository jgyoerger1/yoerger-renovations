<div class="lb" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
  <div class="lb-top">
    <span class="lb-count">1 / 1</span>
    <button class="lb-x" type="button" aria-label="Close">{{icon-x}}</button>
  </div>
  <div class="lb-stage">
    <button class="lb-nav prev" type="button" aria-label="Previous photo">{{icon-caret-left}}</button>
    <img class="lb-img" alt="">
    <button class="lb-nav next" type="button" aria-label="Next photo">{{icon-caret-right}}</button>
  </div>
  <div class="lb-cap">
    <span class="tile-cat lb-cat"></span>
    <b class="lb-title"></b>
    <span class="lb-caption"></span>
  </div>
</div>
<script type="application/json" id="projectsData">{{projectsJson}}</script>
