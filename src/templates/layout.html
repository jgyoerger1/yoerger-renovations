<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta name="robots" content="index,follow,max-image-preview:large">
<meta name="theme-color" content="#2E5A2A">
<meta name="geo.region" content="US-OH">
<meta name="geo.placename" content="{{region}}">
<meta property="og:site_name" content="{{shortName}}">
<meta property="og:type" content="{{ogType}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{ogImage}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="en_US">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{ogImage}}">
<link rel="icon" href="{{root}}favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{root}}img/apple-touch-icon.png">
<link rel="manifest" href="{{root}}site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
{{preload}}
{{styles}}
<script type="application/ld+json">{{jsonld}}</script>
</head>
<body class="{{bodyClass}}">
{{chrome}}
{{content}}
{{footer}}
{{lightbox}}
{{scripts}}
</body>
</html>
